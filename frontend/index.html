<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunità energetiche di Avellino</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

  <div id="app">

    <nav id="colonna" aria-label="Sezioni">
      <div class="marchio" title="Comunità energetiche di Avellino">CER</div>

      <button class="voce attiva" data-sezione="cerca">
        <span class="segno">⌕</span>
        <span class="etichetta">Cerca</span>
      </button>
      <button class="voce" data-sezione="territorio">
        <span class="segno">▦</span>
        <span class="etichetta">Territorio</span>
      </button>
      <button class="voce" data-sezione="metodo">
        <span class="segno">?</span>
        <span class="etichetta">Metodo</span>
      </button>

      <div class="scenario">
        <span class="dicitura">Scenario</span>
        <button class="scelta attiva" data-scenario="ambientale">Ambientale</button>
        <button class="scelta" data-scenario="energetico">Energetico</button>
      </div>

    </nav>

    <main id="mappa"></main>

    <section id="scheda" hidden>
      <button id="chiudi" aria-label="Chiudi">✕</button>
      <div id="contenuto"></div>
    </section>

    <div id="avviso">Caricamento degli edifici…</div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
