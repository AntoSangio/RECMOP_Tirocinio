<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RECMOP — Mappa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

  <div id="app">

    <nav id="colonna" aria-label="Sezioni">
      <a class="marchio" href="index.html" title="Torna alla scelta del comune">RECMOP</a>
      <p class="profilo-attivo" id="profilo-attivo"></p>

      <button class="voce attiva" data-sezione="cerca">
        <span class="segno">⌕</span>
        <span class="etichetta">Cerca</span>
      </button>
      <button class="voce" data-sezione="territorio">
        <span class="segno">▦</span>
        <span class="etichetta">Territorio</span>
      </button>
      <button class="voce" data-sezione="criticita">
        <span class="segno">△</span>
        <span class="etichetta">Criticità</span>
      </button>
      <button class="voce" data-sezione="metodo">
        <span class="segno">?</span>
        <span class="etichetta">Metodo</span>
      </button>

      <div class="scenario" id="scelta-scenario"></div>
    </nav>

    <main id="mappa"></main>

    <div id="livelli">
      <button id="apri-livelli" aria-expanded="false">Livelli</button>
      <div id="pannello-livelli" hidden>

        <p class="gruppo">Colora gli edifici per</p>
        <select id="tema">
          <option value="nessuno">Nessun tema</option>
          <option value="classe">Classe energetica</option>
          <option value="domanda">Consumo annuo</option>
          <option value="produzione">Produzione annua</option>
          <option value="potenza">Potenza installata</option>
        </select>
        <p class="spiegazione-tema" id="spiegazione-tema">
          Scegli un tema per colorare tutti gli edifici secondo un dato e
          osservare come si distribuisce sul territorio.
        </p>

        <p class="gruppo">Edifici</p>
        <label><input type="checkbox" data-filtro="peb" checked> Che producono energia</label>
        <label><input type="checkbox" data-filtro="neb" checked> Che la consumano</label>

        <p class="gruppo">Partecipazione</p>
        <label><input type="checkbox" data-filtro="riuscita" checked> In una comunità</label>
        <label><input type="checkbox" data-filtro="fallita" checked> In tentativi non riusciti</label>
        <label><input type="checkbox" data-filtro="esclusi" checked> Non coinvolti</label>

        <p class="gruppo">Sfondo</p>
        <label><input type="radio" name="sfondo" value="standard" checked> Cartografia</label>
        <label><input type="radio" name="sfondo" value="chiaro"> Versione chiara</label>
        <label><input type="radio" name="sfondo" value="satellite"> Immagine satellitare</label>

      </div>
    </div>

    <section id="scheda" hidden>
      <button id="chiudi" aria-label="Chiudi">✕</button>
      <div id="contenuto"></div>
    </section>

    <div id="avviso">Caricamento degli edifici…</div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
